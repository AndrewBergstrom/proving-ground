<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proving Ground — interview prep for the practical engineer</title>
  <meta name="description" content="Track-based interview prep: learn, practice, quiz, and reinforce. DSA, Forward Deployed, Platform/Cloud, and Applied-AI, with a real coding playground." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚒️</text></svg>" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="logo" id="homeLink" href="#" aria-label="Proving Ground home">
        <span class="logo-mark">⚒</span><span class="logo-text">Proving&nbsp;Ground</span>
      </a>
      <div class="top-actions">
        <button class="top-auth" id="authBtn" hidden>Sign in</button>
        <button class="top-reset" id="resetAll" title="Reset all progress on this device">Reset</button>
        <button class="progress-ring" id="progressRing" title="Overall readiness" aria-label="Overall readiness">
          <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
            <circle class="ring-bg" cx="20" cy="20" r="16"></circle>
            <circle class="ring-fg" id="ringFg" cx="20" cy="20" r="16"></circle>
          </svg>
          <span class="ring-pct" id="ringPct">0%</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-foot">
    <div class="wrap">
      <span>Proving Ground</span><span class="dot">·</span>
      <span>Progress saved locally in your browser.</span><span class="dot">·</span>
      <span>Built from adversarially-verified interview research. Loop details vary by company and change over time.</span>
    </div>
  </footer>

  <script src="assets/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/data.js"></script>
  <script src="assets/judge.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
